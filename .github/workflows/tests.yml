# Dobermann: what every pull request must pass. No backend is needed for any of it.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint:core
      - run: npm run spdx:check
      - run: npm run test:core
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:e2e:console
      - run: npm run test:e2e:webview
      - run: npm run package:prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: ignore
