<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Action</title>
    <!-- No shared CSS — this modal is self-contained to avoid core.css !important conflicts -->
    <style>
        body {
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            color: var(--vscode-foreground);
            background: var(--vscode-editor-background);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .modal-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-widget-border);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            color: var(--vscode-notificationsWarningIcon-foreground);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--vscode-foreground);
            margin: 0;
        }

        .modal-content {
            margin-bottom: 24px;
        }

        .warning-message {
            background: var(--vscode-editorWarning-background);
            border-left: 4px solid var(--vscode-notificationsWarningIcon-foreground);
            padding: 12px 16px;
            margin: 16px 0;
            border-radius: 4px;
        }

        .execution-details {
            background: var(--vscode-editor-inactiveSelectionBackground);
            padding: 12px;
            border-radius: 4px;
            font-family: var(--vscode-editor-font-family);
            font-size: var(--vscode-editor-font-size);
            border: 1px solid var(--vscode-input-border);
            margin: 12px 0;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 16px 0;
            padding: 12px;
            background: var(--vscode-input-background);
            border: 1px solid var(--vscode-input-border);
            border-radius: 4px;
        }

        .checkbox-container input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--vscode-button-background);
        }

        .checkbox-container label {
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            min-width: 80px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        .btn-primary:hover {
            background: var(--vscode-button-hoverBackground);
        }

        .btn-secondary {
            background: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }

        .btn-secondary:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        .btn-danger {
            background: var(--vscode-testing-iconFailed, #dc3545);
            color: #fff;
        }

        .btn-danger:hover {
            background: var(--vscode-testing-iconFailed, #dc3545);
            opacity: 0.9;
        }

        .files-list {
            max-height: 120px;
            overflow-y: auto;
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-input-border);
            border-radius: 4px;
            padding: 8px;
            margin: 8px 0;
        }

        .file-item {
            padding: 4px 8px;
            font-family: var(--vscode-editor-font-family);
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
            border-bottom: 1px solid var(--vscode-widget-border);
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-icon {
            margin-right: 6px;
            color: var(--vscode-symbolIcon-fileForeground);
        }
    </style>
</head>
<body>
    <div class="modal-container">
        <div class="modal-header">
            <svg class="modal-icon" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.964 0L.165 13.233c-.457.778.091 1.767.982 1.767h13.706c.89 0 1.438-.99.982-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
            <h2 class="modal-title">Confirm Deletion</h2>
        </div>

        <div class="modal-content">
            <p id="confirmation-message">Are you sure you want to delete this transaction?</p>
            
            <div class="warning-message">
                <strong>⚠️ Warning:</strong> This action cannot be undone. The execution record and all associated files will be permanently deleted.
            </div>

            <div class="execution-details" id="execution-details">
                <!-- Execution details will be populated here -->
            </div>

            <div id="files-section" style="display: none;">
                <p><strong>Files to be deleted:</strong></p>
                <div class="files-list" id="files-list">
                    <!-- Files list will be populated here -->
                </div>
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="dont-ask-again" />
                <label for="dont-ask-again">Don't ask me again for transaction deletions</label>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
            <button class="btn btn-danger" id="delete-btn">Delete</button>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        // Get DOM elements
        const confirmationMessage = document.getElementById('confirmation-message');
        const executionDetails = document.getElementById('execution-details');
        const filesSection = document.getElementById('files-section');
        const filesList = document.getElementById('files-list');
        const dontAskAgain = document.getElementById('dont-ask-again');
        const cancelBtn = document.getElementById('cancel-btn');
        const deleteBtn = document.getElementById('delete-btn');

        // Handle incoming messages
        window.addEventListener('message', event => {
            const message = event.data;
            
            if (message.type === 'setConfirmationData') {
                populateConfirmationData(message.data);
            }
        });

        function populateConfirmationData(data) {
            // Update confirmation message
            confirmationMessage.textContent = data.message || 'Are you sure you want to delete this transaction?';
            
            // Update execution details
            if (data.executionLabel) {
                executionDetails.innerHTML = `
                    <strong>Transaction:</strong> ${escapeHtml(data.executionLabel)}<br>
                    <strong>Type:</strong> ${escapeHtml(data.executionType || 'execution')}<br>
                    ${data.executionId ? `<strong>ID:</strong> ${escapeHtml(data.executionId)}<br>` : ''}
                `;
            }
            
            // Update files list
            if (data.filesToDelete && data.filesToDelete.length > 0) {
                filesSection.style.display = 'block';
                filesList.innerHTML = data.filesToDelete.map(file => `
                    <div class="file-item">
                        <span class="file-icon">📄</span>
                        ${escapeHtml(getFileName(file))}
                    </div>
                `).join('');
            } else {
                filesSection.style.display = 'none';
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function getFileName(filePath) {
            return filePath.split('/').pop() || filePath.split('\\').pop() || filePath;
        }

        // Event handlers
        cancelBtn.addEventListener('click', () => {
            vscode.postMessage({
                type: 'confirmationResponse',
                response: 'cancel'
            });
        });

        deleteBtn.addEventListener('click', () => {
            vscode.postMessage({
                type: 'confirmationResponse',
                response: 'delete',
                dontAskAgain: dontAskAgain.checked
            });
        });

        // Handle keyboard shortcuts
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                cancelBtn.click();
            } else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                deleteBtn.click();
            }
        });

        // Focus management
        deleteBtn.focus();
    </script>
</body>
</html>
